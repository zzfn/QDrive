name: release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        os: [linux, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          BUILD_VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p build dist
          bin=qdrive
          if [ "$GOOS" = windows ]; then bin=qdrive.exe; fi
          go build -trimpath -ldflags "-X main.version=$BUILD_VERSION" -o "build/${bin}" ./cmd/qdrive

      - name: Package
        run: |
          base=qdrive-${{ matrix.os }}-${{ matrix.arch }}
          if [ "${{ matrix.os }}" = windows ]; then
            name=${base}.zip
            (cd build && zip -9 -X "../dist/${name}" qdrive.exe)
          else
            name=${base}.tar.gz
            tar -C build -czf "dist/${name}" qdrive
          fi
          cd dist && sha256sum "${name}" > "${name}.sha256"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: qdrive-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/qdrive-${{ matrix.os }}-${{ matrix.arch }}.*
          if-no-files-found: error
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          pattern: qdrive-*
          path: dist/
          merge-multiple: true

      - name: Verify checksums
        run: |
          cd dist
          ls -l
          for f in qdrive-linux-amd64.tar.gz qdrive-linux-arm64.tar.gz qdrive-windows-amd64.zip qdrive-windows-arm64.zip; do
            test -f "$f" && test -f "$f.sha256"
          done
          sha256sum -c *.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          fail_on_unmatched_files: true
